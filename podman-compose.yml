version: '3.8'
services:
  mongodb:
    image: mongo:7
    container_name: bun-line-better-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db
    command: ["--replSet", "rs0"]
volumes:
  mongo_data: